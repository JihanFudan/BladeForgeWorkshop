[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="BladeForgeWorkshop"
authors="jihanfudan"
description='''锻刀工坊是《拔刀剑：重锋》的锻刀附属模组，适用于 Minecraft 1.21.1 + NeoForge，需要同时安装 SlashBlade Resharped。

制作方式与原版拔刀剑略有不同：使用刀镡制作台、烧铁炉、锻造铁砧和刀剑制作台，完成配件加工、钢材配比、锻打、覆土淬火与成刀组装。

成品刀条由五枚灼热钢锻打而成：钢锭、低碳钢、高碳钢可随意混放，每种钢的单枚攻击／耐久基数不同，混熔按枚数加权结算。碳粉在锻造铁砧上由煤炭或木炭研磨得到，是低碳钢与高碳钢的原料。

木偶与竹光手持对应的木刀条／竹刀条右键即可现场组装，需备齐刀镡、刀柄、刀鞘各一件；其余名刀在刀剑制作台制作，一律使用成品刀条与纯铁、纯金或纯铜刀镡三选一。刀剑制作台自动接管本体及附属的工作台、锻造台拔刀剑配方，保留原材料和原刀条件。右键逐件放入材料，锻造锤右键完成；升级保留杀敌数、耀魂数、精炼数与基础攻击养成。支持通过数据包增加或覆盖配方。

自定义拔刀剑系统提供专用制作台：放入刀条、刀镡、刀鞘和刀柄后，可分别从已安装的兼容拔刀剑中选择四个部件的外观来源，并选择 SA（特殊攻击）。界面右侧会实时显示当前部件的真实模型预览，方便确认刀条、刀镡、刀鞘和刀柄的造型后再组装。

锻造铁砧可吸收耀魂碎片、耀魂铁锭和耀魂宝珠，增加精炼、耀魂、杀敌数并恢复耐久。精炼伤害和耀魂锻打攻击采用递减增长：精炼越高，单次伤害增益越少。钢材配比与刀镡材质决定制刀时的攻击和耐久上限修正。

锻造有失败机制：刀条类工件在烧铁炉烧红后 5 秒内没夹出会过火报废成失败的刀条，无法锻打做刀，放回熔炉或烧铁炉回烧每枚固定产出 3 枚铁锭；铁砧耀魂锻打的失手率记录在每把刀上，成功后下一锤增加 1%，失手后下一锤降低 1%，最低为 0%、最高封顶 50%。失手的那一锤不给精炼数、不涨伤害、不给杀敌数，只吃进一半耀魂，耐久恢复减半。

初次进入世界即可获得《锻刀工坊游玩手册》，按步骤学习当前全部制作流程；之后不再按死亡或登录重复发放，想再要一本可在工作台用一本书加一把锻造锤无序合成，锻造锤不会被消耗。安装 JEI 可查看完整的合成方法、材料数量及工位加工说明；默认指向物品按 R 查询制作，按 U 查询用途。

致谢：本模组的检视功能改编自 猫叩MewKooo 制作的 SlashBlade Inspect 检视模组，在此向原作者与贡献者致以诚挚的谢意。

主页：https://www.curseforge.com/minecraft/mc-mods/blade-forge-workshop/files/all?page=1&pageSize=20&showAlphaFiles=hide'''
[[mixins]]
config="slashbladeresh_slashblad.mixins.json"

[[dependencies.mod_id]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.mod_id]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.mod_id]]
modId="slashblade"
type="required"
# 本发布版针对重锋 2.0.7 与 2.0.8 验证；上限避免未来破坏性接口更新被误判兼容。
versionRange="[2.0.7-1.21.1,2.0.9-1.21.1)"
ordering="AFTER"
side="BOTH"
